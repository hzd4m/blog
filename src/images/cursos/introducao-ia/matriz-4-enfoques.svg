<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 472" role="img" aria-label="Matriz 2x2 dos quatro enfoques da IA: pensar como humano, pensar racionalmente, agir como humano, agir racionalmente.">
  <rect x="2" y="2" width="756" height="468" rx="16" fill="#0d1117" stroke="#232a33"/>
  <text x="24" y="40" fill="#e6edf3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="700">Os quatro enfoques da IA</text>
  <text x="24" y="60" fill="#9aa4b2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">duas dimensões cruzadas · quatro escolas de pensamento</text>

  <!-- Column headers -->
  <text x="285" y="92" fill="#9aa4b2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1" text-anchor="middle">FIDELIDADE AO HUMANO</text>
  <text x="596" y="92" fill="#9aa4b2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1" text-anchor="middle">RACIONALIDADE · "FAZER O CERTO"</text>

  <!-- Row labels -->
  <text x="122" y="176" fill="#9aa4b2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="end">PENSAMENTO</text>
  <text x="122" y="192" fill="#6b7480" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="end">processo interno</text>
  <text x="122" y="338" fill="#9aa4b2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="end">COMPORTAMENTO</text>
  <text x="122" y="354" fill="#6b7480" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="end">ação externa</text>

  <!-- Cells -->
  <!-- r1c1 -->
  <rect x="132" y="104" width="298" height="150" rx="10" fill="#161b22" stroke="#232a33"/>
  <text x="152" y="150" fill="#e6edf3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">Pensar como humano</text>
  <text x="152" y="176" fill="#9aa4b2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">modelagem cognitiva:</text>
  <text x="152" y="196" fill="#9aa4b2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">reproduzir os passos do</text>
  <text x="152" y="216" fill="#9aa4b2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">raciocínio da mente.</text>

  <!-- r1c2 -->
  <rect x="446" y="104" width="298" height="150" rx="10" fill="#161b22" stroke="#232a33"/>
  <text x="466" y="150" fill="#e6edf3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">Pensar racionalmente</text>
  <text x="466" y="176" fill="#9aa4b2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">as "leis do pensamento":</text>
  <text x="466" y="196" fill="#9aa4b2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">raciocínio correto pela</text>
  <text x="466" y="216" fill="#9aa4b2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">lógica formal.</text>

  <!-- r2c1 -->
  <rect x="132" y="266" width="298" height="150" rx="10" fill="#161b22" stroke="#232a33"/>
  <text x="152" y="312" fill="#e6edf3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">Agir como humano</text>
  <text x="152" y="338" fill="#9aa4b2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">o Teste de Turing:</text>
  <text x="152" y="358" fill="#9aa4b2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">comportar-se de modo</text>
  <text x="152" y="378" fill="#9aa4b2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">indistinguível de gente.</text>

  <!-- r2c2 highlighted -->
  <rect x="446" y="266" width="298" height="150" rx="10" fill="#1b160e" stroke="#f2760c" stroke-width="2"/>
  <text x="466" y="312" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">Agir racionalmente</text>
  <text x="466" y="338" fill="#d9c4a6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">o agente racional: agir</text>
  <text x="466" y="358" fill="#d9c4a6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">para o melhor resultado</text>
  <text x="466" y="378" fill="#d9c4a6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">esperado.</text>
  <text x="466" y="402" fill="#f2760c" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">◄ a escolha deste curso</text>

  <text x="24" y="452" fill="#6b7480" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Colunas: contra quem medimos (humano × racional). Linhas: o que medimos (pensamento × comportamento).</text>
</svg>
